  simplecloud-unavailable: "&cSimpleCloud nicht erreichbar. Bitte versuche es später erneut."
  timeout: "&cDie Anfrage hat zu lange gedauert. Bitte versuche es später erneut."
  busy: "&cBuildReplay ist gerade ausgelastet. Bitte versuche es gleich erneut."
  maintenance: "&c{reason}"
  generic: "&cEin interner Fehler ist aufgetreten. Details stehen in der Serverkonsole."
